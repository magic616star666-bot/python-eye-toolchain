name: Verify Android ARM64 libc++ Maven provider
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/verify-libcxx-arm64-provider.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify Maven AAR contains real ARM64 libc++_shared.so
        shell: bash
        run: |
          python - <<'PY'
          import io, urllib.request, zipfile, hashlib, struct, sys
          version = "29.0.14206865"
          url = f"https://repo.maven.apache.org/maven2/dev/atsushieno/libcxx-provider/{version}/libcxx-provider-{version}.aar"
          with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"PythonEyeIDE-runtime-validator/1.0"}),timeout=60) as r:
              if r.status != 200: raise RuntimeError(f"Maven HTTP {r.status}")
              blob = r.read(40_000_000)
          with zipfile.ZipFile(io.BytesIO(blob)) as archive:
              names=[n for n in archive.namelist() if n.endswith("/arm64-v8a/libc++_shared.so")]
              if not names: raise RuntimeError("AAR has no ARM64 libc++_shared.so!")
              data=archive.read(names[0])
              if len(data)<100_000 or data[:4]!=b"\x7fELF" or data[4]!=2 or data[5]!=1 or struct.unpack_from("<H",data,18)[0]!=183:
                  raise RuntimeError("Wrong architecture or invalid ARM64 ELF")
              print("PASS",names[0],"size",len(data),"sha256",hashlib.sha256(data).hexdigest(),"aar_bytes",len(blob))
          PY

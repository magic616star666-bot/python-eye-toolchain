name: Audit Python Eye Release Contents
on:
  push:
    paths:
      - scripts/audit_release_archives.py
      - .github/workflows/audit-release-archives.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify archives and enumerate binaries
        run: python scripts/audit_release_archives.py
      - name: Commit review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive_audit.json
          git diff --cached --quiet || (git commit -m "Record audit of real Android ARM64 archive contents" && git push)

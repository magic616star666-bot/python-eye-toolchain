name: Validate Tool Catalog
on:
  push:
    paths:
      - tools.json
      - scripts/validate_catalog.py
      - .github/workflows/catalog-check.yml
  pull_request:
    paths:
      - tools.json
      - scripts/validate_catalog.py
      - .github/workflows/catalog-check.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/validate_catalog.py

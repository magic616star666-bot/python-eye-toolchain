name: Validate Tool Catalog and Real Release Assets
on:
  push:
    paths:
      - tools.json
      - managed-tools.json
      - official_install_routes.json
      - scripts/validate_catalog.py
      - scripts/test_catalog_validator.py
      - scripts/verify_release_assets.py
      - scripts/verify_maven_tools.py
      - toolchains/build-rules.json
      - scripts/validate_build_rules.py
      - .github/workflows/catalog-check.yml
  pull_request:
    paths:
      - tools.json
      - managed-tools.json
      - official_install_routes.json
      - scripts/validate_catalog.py
      - scripts/test_catalog_validator.py
      - scripts/verify_release_assets.py
      - scripts/verify_maven_tools.py
      - toolchains/build-rules.json
      - scripts/validate_build_rules.py
      - .github/workflows/catalog-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate eight tool IDs, all dependencies and managed install policies
        run: python scripts/validate_catalog.py
      - name: Check rejection of fake downloads, duplicate IDs, unsupported versions
        run: PYTHONPATH=scripts python scripts/test_catalog_validator.py
      - name: Build rules (AGP -> Build-Tools) use the IDE's own validation rules
        run: python scripts/validate_build_rules.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Load + Test every Maven JAR tool exactly like the IDE (same build.gradle, same probes)
        run: python scripts/verify_maven_tools.py
      - name: Verify uploaded Release sizes and SHA-256 digests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/verify_release_assets.py

name: Bootstrap Real Android Tool Assets
on:
  push:
    paths:
      - .github/workflows/bootstrap-real-assets.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: real-tool-assets
  cancel-in-progress: false
jobs:
  publish-real-binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download upstream binaries, verify digests, upload real release assets, update catalog
        run: python scripts/bootstrap_real_assets.py

name: Refresh Python Eye official version catalogue
on:
  workflow_dispatch:
  schedule:
    - cron: "31 3 * * 1"
  push:
    paths:
      - "scripts/generate_official_version_index.py"
      - ".github/workflows/refresh-official-versions.yml"
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch official metadata and verify entries
        run: python scripts/generate_official_version_index.py
      - name: Update Github metadata (no binary copies)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toolchains/official-on-demand.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh official Gradle and Android SDK on-demand index"
            git push
          fi

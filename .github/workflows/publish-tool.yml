name: Publish Verified Tool Asset
on:
  workflow_dispatch:
    inputs:
      tool_id:
        description: "Exact id from tools.json, e.g. openjdk-17"
        required: true
        type: string
      version:
        description: "Tested version, e.g. 17.0.12"
        required: true
        type: string
      source_url:
        description: "Public HTTPS direct download URL"
        required: true
        type: string
      sha256:
        description: "Real 64-character SHA-256 hash of the archive"
        required: true
        type: string
      asset_name:
        description: "Release filename (zip, jar, tgz, tar.gz)"
        required: true
        type: string
      tested_on_android_arm64:
        description: "Only select yes after testing on a real ARM64 Android phone"
        required: true
        type: choice
        options:
          - 'no'
          - 'yes'
        default: 'no'
permissions:
  contents: write
concurrency:
  group: toolchain-release-publish
  cancel-in-progress: false
jobs:
  publish:
    if: inputs.tested_on_android_arm64 == 'yes'
    runs-on: ubuntu-latest
    env:
      TOOL_ID: ${{ inputs.tool_id }}
      TOOL_VERSION: ${{ inputs.version }}
      SOURCE_URL: ${{ inputs.source_url }}
      EXPECTED_SHA256: ${{ inputs.sha256 }}
      ASSET_NAME: ${{ inputs.asset_name }}
      TESTED_ON_ANDROID_ARM64: ${{ inputs.tested_on_android_arm64 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download and verify archive
        run: python scripts/publish_release.py download
      - name: Create release if needed
        run: |
          if ! gh release view toolchain-v1 >/dev/null 2>&1; then
            gh release create toolchain-v1 --title "Python Eye Toolchain Assets" --notes "Verified binaries for Python Eye IDE."
          fi
      - name: Upload checked archive
        run: gh release upload toolchain-v1 "dist/$ASSET_NAME"
      - name: Register release asset in catalog
        run: |
          python scripts/publish_release.py mark
          python scripts/validate_catalog.py
      - name: Commit updated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools.json
          git commit -m "Publish verified tool $TOOL_ID $TOOL_VERSION"
          git push
